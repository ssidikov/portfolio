<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bg_hrnet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0922" />
      <stop offset="50%" stop-color="#1b1242" />
      <stop offset="100%" stop-color="#070411" />
    </linearGradient>
    <radialGradient id="g1_hrnet" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="g2_hrnet" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent_hrnet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="glass_hrnet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="stroke_hrnet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow_hrnet" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid_hrnet" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg_hrnet)" />
  <rect width="1200" height="675" fill="url(#grid_hrnet)" />

  <circle cx="600" cy="337" r="340" fill="url(#g1_hrnet)" />
  <circle cx="920" cy="180" r="260" fill="url(#g2_hrnet)" />
  <circle cx="280" cy="500" r="240" fill="url(#g2_hrnet)" opacity="0.5" />

  <g opacity="0.35">
    <ellipse cx="600" cy="337" rx="360" ry="180" fill="none" stroke="url(#stroke_hrnet)" stroke-width="1.5" transform="rotate(-15 600 337)" stroke-dasharray="12 12" />
    <ellipse cx="600" cy="337" rx="280" ry="140" fill="none" stroke="url(#stroke_hrnet)" stroke-width="1" transform="rotate(25 600 337)" />
  </g>

  <g filter="url(#glow_hrnet)">
      <circle cx="600" cy="240" r="35" fill="url(#glass_hrnet)" stroke="url(#stroke_hrnet)" stroke-width="2.5" />
      <circle cx="490" cy="390" r="30" fill="url(#glass_hrnet)" stroke="url(#stroke_hrnet)" stroke-width="2" />
      <circle cx="710" cy="390" r="30" fill="url(#glass_hrnet)" stroke="url(#stroke_hrnet)" stroke-width="2" />
      <line x1="600" y1="275" x2="490" y2="360" stroke="url(#accent_hrnet)" stroke-width="2.5" />
      <line x1="600" y1="275" x2="710" y2="360" stroke="url(#accent_hrnet)" stroke-width="2.5" />
      <circle cx="600" cy="240" r="14" fill="#8b5cf6" />
      <circle cx="490" cy="390" r="12" fill="#6366f1" />
      <circle cx="710" cy="390" r="12" fill="#6366f1" />
    </g>
</svg>