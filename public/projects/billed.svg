<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bg_billed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06151c" />
      <stop offset="50%" stop-color="#0c2734" />
      <stop offset="100%" stop-color="#030a0e" />
    </linearGradient>
    <radialGradient id="g1_billed" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#0ea5e9" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="g2_billed" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent_billed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="glass_billed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="stroke_billed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow_billed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid_billed" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg_billed)" />
  <rect width="1200" height="675" fill="url(#grid_billed)" />

  <circle cx="600" cy="337" r="340" fill="url(#g1_billed)" />
  <circle cx="920" cy="180" r="260" fill="url(#g2_billed)" />
  <circle cx="280" cy="500" r="240" fill="url(#g2_billed)" opacity="0.5" />

  <g opacity="0.35">
    <ellipse cx="600" cy="337" rx="360" ry="180" fill="none" stroke="url(#stroke_billed)" stroke-width="1.5" transform="rotate(-15 600 337)" stroke-dasharray="12 12" />
    <ellipse cx="600" cy="337" rx="280" ry="140" fill="none" stroke="url(#stroke_billed)" stroke-width="1" transform="rotate(25 600 337)" />
  </g>

  <g filter="url(#glow_billed)">
      <rect x="500" y="220" width="200" height="240" rx="16" fill="url(#glass_billed)" stroke="url(#stroke_billed)" stroke-width="2.5" />
      <circle cx="600" cy="310" r="36" fill="none" stroke="#10b981" stroke-width="3" />
      <path d="M 586 310 L 596 320 L 616 298" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="540" y1="385" x2="660" y2="385" stroke="url(#accent_billed)" stroke-width="3" stroke-linecap="round" />
      <line x1="540" y1="415" x2="620" y2="415" stroke="url(#accent_billed)" stroke-width="3" stroke-linecap="round" />
    </g>
</svg>