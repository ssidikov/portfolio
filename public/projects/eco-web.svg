<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bg_ecoweb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06160e" />
      <stop offset="50%" stop-color="#0c2e1d" />
      <stop offset="100%" stop-color="#030d08" />
    </linearGradient>
    <radialGradient id="g1_ecoweb" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="g2_ecoweb" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent_ecoweb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="glass_ecoweb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="stroke_ecoweb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow_ecoweb" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid_ecoweb" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg_ecoweb)" />
  <rect width="1200" height="675" fill="url(#grid_ecoweb)" />

  <circle cx="600" cy="337" r="340" fill="url(#g1_ecoweb)" />
  <circle cx="920" cy="180" r="260" fill="url(#g2_ecoweb)" />
  <circle cx="280" cy="500" r="240" fill="url(#g2_ecoweb)" opacity="0.5" />

  <!-- Abstract Orbit Rings -->
  <g opacity="0.35">
    <ellipse cx="600" cy="337" rx="360" ry="180" fill="none" stroke="url(#stroke_ecoweb)" stroke-width="1.5" transform="rotate(-15 600 337)" stroke-dasharray="12 12" />
    <ellipse cx="600" cy="337" rx="280" ry="140" fill="none" stroke="url(#stroke_ecoweb)" stroke-width="1" transform="rotate(25 600 337)" />
    <circle cx="600" cy="337" r="220" fill="none" stroke="url(#stroke_ecoweb)" stroke-width="1" stroke-dasharray="6 6" />
  </g>

  <!-- Central Thematic 3D / Geometric Artwork -->
  
  <g filter="url(#glow_ecoweb)">
    <!-- Bio-Matrix Hexagon -->
    <polygon points="600,205 715,270 715,405 600,470 485,405 485,270" fill="url(#glass_ecoweb)" stroke="url(#stroke_ecoweb)" stroke-width="2.5" />

    <!-- 3D Crystalline Leaf Motif with Circuit Veins -->
    <path d="M 600 235 C 680 280 670 400 600 440 C 530 400 520 280 600 235 Z" fill="url(#glass_ecoweb)" stroke="url(#accent_ecoweb)" stroke-width="2.5" />
    <line x1="600" y1="255" x2="600" y2="420" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <line x1="600" y1="300" x2="640" y2="320" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <line x1="600" y1="340" x2="560" y2="360" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <line x1="600" y1="380" x2="635" y2="400" stroke="#10b981" stroke-width="2" stroke-linecap="round" />

    <circle cx="600" cy="337" r="12" fill="#34d399" />
  </g>
</svg>