<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bg_cookies" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b0f05" />
      <stop offset="50%" stop-color="#301a09" />
      <stop offset="100%" stop-color="#0d0702" />
    </linearGradient>
    <radialGradient id="g1_cookies" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#f97316" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="g2_cookies" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent_cookies" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="glass_cookies" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="stroke_cookies" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow_cookies" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid_cookies" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg_cookies)" />
  <rect width="1200" height="675" fill="url(#grid_cookies)" />

  <circle cx="600" cy="337" r="340" fill="url(#g1_cookies)" />
  <circle cx="920" cy="180" r="260" fill="url(#g2_cookies)" />
  <circle cx="280" cy="500" r="240" fill="url(#g2_cookies)" opacity="0.5" />

  <g opacity="0.35">
    <ellipse cx="600" cy="337" rx="360" ry="180" fill="none" stroke="url(#stroke_cookies)" stroke-width="1.5" transform="rotate(-15 600 337)" stroke-dasharray="12 12" />
    <ellipse cx="600" cy="337" rx="280" ry="140" fill="none" stroke="url(#stroke_cookies)" stroke-width="1" transform="rotate(25 600 337)" />
  </g>

  <g filter="url(#glow_cookies)">
      <circle cx="600" cy="337" r="130" fill="url(#glass_cookies)" stroke="url(#stroke_cookies)" stroke-width="3" />
      <circle cx="560" cy="300" r="16" fill="#f97316" />
      <circle cx="640" cy="310" r="14" fill="#f97316" />
      <circle cx="590" cy="370" r="18" fill="#f97316" />
      <circle cx="645" cy="375" r="12" fill="#fbbf24" />
      <circle cx="545" cy="355" r="10" fill="#fbbf24" />
    </g>
</svg>