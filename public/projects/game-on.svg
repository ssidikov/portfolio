<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bg_gameon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160818" />
      <stop offset="50%" stop-color="#2a0e2f" />
      <stop offset="100%" stop-color="#0a030b" />
    </linearGradient>
    <radialGradient id="g1_gameon" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#d946ef" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="g2_gameon" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent_gameon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glass_gameon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="stroke_gameon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#d946ef" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow_gameon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid_gameon" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg_gameon)" />
  <rect width="1200" height="675" fill="url(#grid_gameon)" />

  <circle cx="600" cy="337" r="340" fill="url(#g1_gameon)" />
  <circle cx="920" cy="180" r="260" fill="url(#g2_gameon)" />
  <circle cx="280" cy="500" r="240" fill="url(#g2_gameon)" opacity="0.5" />

  <g opacity="0.35">
    <ellipse cx="600" cy="337" rx="360" ry="180" fill="none" stroke="url(#stroke_gameon)" stroke-width="1.5" transform="rotate(-15 600 337)" stroke-dasharray="12 12" />
    <ellipse cx="600" cy="337" rx="280" ry="140" fill="none" stroke="url(#stroke_gameon)" stroke-width="1" transform="rotate(25 600 337)" />
  </g>

  <g filter="url(#glow_gameon)">
      <polygon points="600,190 730,265 730,410 600,485 470,410 470,265" fill="url(#glass_gameon)" stroke="url(#stroke_gameon)" stroke-width="2.5" />
      <!-- D-pad / Gaming motif -->
      <rect x="545" y="325" width="110" height="24" rx="4" fill="url(#accent_gameon)" />
      <rect x="588" y="282" width="24" height="110" rx="4" fill="url(#accent_gameon)" />
      <circle cx="600" cy="337" r="8" fill="#ffffff" />
    </g>
</svg>