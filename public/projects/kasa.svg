<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bg_kasa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0c0a" />
      <stop offset="50%" stop-color="#331511" />
      <stop offset="100%" stop-color="#0f0504" />
    </linearGradient>
    <radialGradient id="g1_kasa" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ff6060" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#ff6060" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ff6060" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="g2_kasa" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent_kasa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6060" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="glass_kasa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="stroke_kasa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ff6060" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow_kasa" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid_kasa" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg_kasa)" />
  <rect width="1200" height="675" fill="url(#grid_kasa)" />

  <circle cx="600" cy="337" r="340" fill="url(#g1_kasa)" />
  <circle cx="920" cy="180" r="260" fill="url(#g2_kasa)" />
  <circle cx="280" cy="500" r="240" fill="url(#g2_kasa)" opacity="0.5" />

  <g opacity="0.35">
    <ellipse cx="600" cy="337" rx="360" ry="180" fill="none" stroke="url(#stroke_kasa)" stroke-width="1.5" transform="rotate(-15 600 337)" stroke-dasharray="12 12" />
    <ellipse cx="600" cy="337" rx="280" ry="140" fill="none" stroke="url(#stroke_kasa)" stroke-width="1" transform="rotate(25 600 337)" />
  </g>

  <g filter="url(#glow_kasa)">
      <polygon points="600,180 720,280 720,470 480,470 480,280" fill="url(#glass_kasa)" stroke="url(#stroke_kasa)" stroke-width="2.5" />
      <path d="M 550 470 A 50 50 0 0 1 650 470 Z" fill="url(#glass_kasa)" stroke="url(#accent_kasa)" stroke-width="2" />
      <circle cx="600" cy="310" r="32" fill="url(#glass_kasa)" stroke="url(#accent_kasa)" stroke-width="2" />
    </g>
</svg>