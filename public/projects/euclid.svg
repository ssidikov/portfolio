<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bg_euclid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081220" />
      <stop offset="50%" stop-color="#0e2038" />
      <stop offset="100%" stop-color="#040910" />
    </linearGradient>
    <radialGradient id="g1_euclid" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="g2_euclid" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent_euclid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="glass_euclid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="stroke_euclid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow_euclid" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid_euclid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg_euclid)" />
  <rect width="1200" height="675" fill="url(#grid_euclid)" />

  <circle cx="600" cy="337" r="340" fill="url(#g1_euclid)" />
  <circle cx="920" cy="180" r="260" fill="url(#g2_euclid)" />
  <circle cx="280" cy="500" r="240" fill="url(#g2_euclid)" opacity="0.5" />

  <g opacity="0.35">
    <ellipse cx="600" cy="337" rx="360" ry="180" fill="none" stroke="url(#stroke_euclid)" stroke-width="1.5" transform="rotate(-15 600 337)" stroke-dasharray="12 12" />
    <ellipse cx="600" cy="337" rx="280" ry="140" fill="none" stroke="url(#stroke_euclid)" stroke-width="1" transform="rotate(25 600 337)" />
  </g>

  <g filter="url(#glow_euclid)">
      <polygon points="600,200 710,265 710,395 600,460 490,395 490,265" fill="url(#glass_euclid)" stroke="url(#stroke_euclid)" stroke-width="2.5" />
      <polygon points="600,250 670,290 670,370 600,410 530,370 530,290" fill="none" stroke="url(#accent_euclid)" stroke-width="2" />
      <circle cx="600" cy="330" r="16" fill="#eab308" />
    </g>
</svg>