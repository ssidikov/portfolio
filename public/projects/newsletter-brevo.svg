<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bg_brevo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071324" />
      <stop offset="50%" stop-color="#0d2547" />
      <stop offset="100%" stop-color="#040b16" />
    </linearGradient>
    <radialGradient id="g1_brevo" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="g2_brevo" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent_brevo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glass_brevo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="stroke_brevo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow_brevo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid_brevo" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg_brevo)" />
  <rect width="1200" height="675" fill="url(#grid_brevo)" />

  <circle cx="600" cy="337" r="340" fill="url(#g1_brevo)" />
  <circle cx="920" cy="180" r="260" fill="url(#g2_brevo)" />
  <circle cx="280" cy="500" r="240" fill="url(#g2_brevo)" opacity="0.5" />

  <!-- Abstract Orbit Rings -->
  <g opacity="0.35">
    <ellipse cx="600" cy="337" rx="360" ry="180" fill="none" stroke="url(#stroke_brevo)" stroke-width="1.5" transform="rotate(-15 600 337)" stroke-dasharray="12 12" />
    <ellipse cx="600" cy="337" rx="280" ry="140" fill="none" stroke="url(#stroke_brevo)" stroke-width="1" transform="rotate(25 600 337)" />
    <circle cx="600" cy="337" r="220" fill="none" stroke="url(#stroke_brevo)" stroke-width="1" stroke-dasharray="6 6" />
  </g>

  <!-- Central Thematic 3D / Geometric Artwork -->
  
  <g filter="url(#glow_brevo)">
    <!-- Origami Flight Angle -->
    <polygon points="480,380 600,230 720,380 600,340" fill="url(#glass_brevo)" stroke="url(#stroke_brevo)" stroke-width="2.5" />
    <line x1="600" y1="230" x2="600" y2="340" stroke="url(#accent_brevo)" stroke-width="2.5" />

    <!-- Envelope Fold Lines -->
    <polygon points="490,290 710,290 600,380" fill="none" stroke="url(#accent_brevo)" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />

    <!-- Dynamic Speed Light Rays -->
    <line x1="420" y1="337" x2="460" y2="337" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
    <line x1="740" y1="337" x2="780" y2="337" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />
    <line x1="600" y1="190" x2="600" y2="150" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>