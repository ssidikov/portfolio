<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bg_chezliqi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180a0c" />
      <stop offset="50%" stop-color="#2c1216" />
      <stop offset="100%" stop-color="#0e0506" />
    </linearGradient>
    <radialGradient id="g1_chezliqi" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#ef4444" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="g2_chezliqi" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent_chezliqi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="glass_chezliqi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="stroke_chezliqi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow_chezliqi" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid_chezliqi" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg_chezliqi)" />
  <rect width="1200" height="675" fill="url(#grid_chezliqi)" />

  <circle cx="600" cy="337" r="340" fill="url(#g1_chezliqi)" />
  <circle cx="920" cy="180" r="260" fill="url(#g2_chezliqi)" />
  <circle cx="280" cy="500" r="240" fill="url(#g2_chezliqi)" opacity="0.5" />

  <!-- Abstract Orbit Rings -->
  <g opacity="0.35">
    <ellipse cx="600" cy="337" rx="360" ry="180" fill="none" stroke="url(#stroke_chezliqi)" stroke-width="1.5" transform="rotate(-15 600 337)" stroke-dasharray="12 12" />
    <ellipse cx="600" cy="337" rx="280" ry="140" fill="none" stroke="url(#stroke_chezliqi)" stroke-width="1" transform="rotate(25 600 337)" />
    <circle cx="600" cy="337" r="220" fill="none" stroke="url(#stroke_chezliqi)" stroke-width="1" stroke-dasharray="6 6" />
  </g>

  <!-- Central Thematic 3D / Geometric Artwork -->
  
  <g filter="url(#glow_chezliqi)">
    <!-- Minimalist Zen Ceramic Circle -->
    <circle cx="600" cy="337" r="130" fill="url(#glass_chezliqi)" stroke="url(#stroke_chezliqi)" stroke-width="3" />
    <circle cx="600" cy="337" r="90" fill="none" stroke="url(#accent_chezliqi)" stroke-width="2" stroke-opacity="0.7" />

    <!-- Stylized Steam / Lotus Flow Curves -->
    <path d="M 570 380 Q 560 320 590 280 T 610 220" fill="none" stroke="url(#accent_chezliqi)" stroke-width="4" stroke-linecap="round" />
    <path d="M 630 380 Q 640 320 610 280 T 590 220" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round" opacity="0.8" />

    <circle cx="600" cy="337" r="16" fill="#ef4444" />
  </g>
</svg>